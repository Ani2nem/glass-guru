# What may reach main.
#
# The gate is deliberately in two halves. Everything that needs no credentials -
# lint, types, tests, the solver invariants and the end-to-end scenarios - runs on
# every pull request including forks, because that is the half that catches real
# defects and it must never be skippable. The tiers that call a model cost money and
# need a role to assume, so they run only where a role can be assumed, and their
# absence is stated in the scorecard rather than passed over in silence.
#
# Both halves compare against evals/baseline.json, so a change that stays above its
# threshold while sliding still blocks. That is the failure mode thresholds miss.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# A force-push should not leave three runs racing for the same comment.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never reach for OSRM or Google from CI. The committed leg snapshot makes every
  # solve offline, free and identical to the one on a developer's machine.
  GLASS_GURU_TRAVEL: frozen

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: mypy --strict
        run: mypy
      - name: pytest
        run: pytest tests -q

  board:
    name: dispatch board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  evals-offline:
    name: evals (tiers 0, 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: tier 0 invariants and tier 3 scenarios
        # A slower runner does not change these numbers: the eval solves are bounded by
        # deterministic work rather than the wall clock, which is the whole reason a
        # committed baseline is comparable across machines at all.
        run: glass-guru-eval --tier 0 --tier 3 --json reports/offline.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-report-offline
          path: reports/offline.json
          if-no-files-found: warn

  evals-model:
    name: evals (tiers 1, 2, 4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A fork cannot assume the role, and handing one our credentials to try would be
    # the single worst thing in this repository. Forks get the offline half.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: assume the CI role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.CI_ROLE_NAME || 'glass-guru-ci' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gg-evals-${{ github.run_id }}
      - name: tiers 1, 2 and 4 against the live model
        run: glass-guru-eval --tier 1 --tier 2 --tier 4 --json reports/model.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-report-model
          path: reports/model.json
          if-no-files-found: warn

  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    needs: [evals-offline, evals-model]
    # Runs even when a tier failed - a red build is exactly when the numbers are worth
    # reading, and a scorecard that only appears on success is decoration.
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v6
        # A crashed eval job uploads nothing. The render step below reports that
        # clearly; failing here would report it as a missing artifact instead.
        continue-on-error: true
        with:
          path: reports
          pattern: eval-report-*
          merge-multiple: true
      - name: render
        run: |
          python -m glass_guru.evals.scorecard \
            reports/offline.json reports/model.json \
            --baseline evals/baseline.json \
            --out scorecard.md
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: comment on the pull request
        # The step summary above is always written and needs no permissions; the
        # comment is the nicety, and it is skipped rather than failed where the token
        # cannot write.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- glass-guru-eval-scorecard -->'
          printf '%s\n\n' "$marker" | cat - scorecard.md > body.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
            echo "posted a new comment"
          fi

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [quality, board, evals-offline, evals-model]
    if: always()
    steps:
      # One required check to protect the branch with, so adding a job later does not
      # mean editing branch protection. `needs` failing is not enough on its own:
      # a skipped dependency would otherwise let this pass.
      - name: every gate must have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) echo "note: a job was skipped (expected for the model tiers on a fork)" ;;
              *) echo "blocking: a required job reported '$result'"; exit 1 ;;
            esac
          done
