# Local development services. Nothing here is needed to run the test suite - the
# synthetic travel provider and the frozen leg snapshot keep tests offline and free.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: glass-guru-osrm
    command: >
      osrm-routed --algorithm mld
      --max-table-size 2000
      /data/Seattle.osrm
    # The default table size of 100 is well under a 5-day horizon's ~130 stops, and
    # one table request is far cheaper than N^2 route calls.
    volumes:
      - ./docker/osrm/data:/data
    ports:
      - "5000:5000"
    healthcheck:
      # The image ships neither wget nor curl, so the original probe reported every
      # healthy container as unhealthy and `--wait` could never succeed. bash is
      # present, and /dev/tcp is enough to ask a real routing question - which beats a
      # port check, because a container that has loaded no map still accepts connections.
      # Connection: close matters: without it OSRM holds the socket on keep-alive and
      # grep blocks until EOF, so a working probe took 5.2s and timed out at 5.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/5000 &&
          printf 'GET /table/v1/driving/-122.33,47.60;-122.35,47.62 HTTP/1.0\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"code":"Ok"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
