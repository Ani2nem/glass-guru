# Business parameters for the scheduling objective.
#
# Every value carries a `source`:
#   estimated  - a plausible guess. Not validated against this business.
#   measured   - derived from the business's own historical data.
#   confirmed  - a human at the business said this number is right.
#
# As of this writing everything is `estimated`. That is deliberate and visible:
# the objective is priced in dollars so its trade-offs are arguable, and that
# argument is only worth having once these are real. `glass-guru params` prints
# this table, and any plan built on estimates is rendered with a warning banner.

meta:
  name: "Sample Glass Co (fixture)"
  timezone: "America/Los_Angeles"
  currency: "USD"

labor:
  loaded_rate_per_minute:
    value: 0.92
    source: estimated
    note: >-
      ~$55/hr fully loaded. Needs the real figure: base wage plus payroll tax,
      workers' comp, insurance, benefits and non-billable time. This term
      usually dominates the objective, so it is the first number to get right.

  overtime_multiplier:
    value: 1.5
    source: estimated
    note: "Standard US time-and-a-half. Verify against actual payroll practice."

  overtime_max_minutes:
    value: 120
    source: estimated
    note: "How far past shift end a crew may be pushed before the day is refused."

vehicle:
  cost_per_mile:
    value: 0.65
    source: estimated
    note: >-
      Fuel, tyres, maintenance, depreciation. Near the IRS business mileage rate,
      which is a reasonable proxy but not this fleet's actual cost.

scheduling:
  quoted_window_minutes:
    value: 120
    source: estimated
    note: >-
      Width of the arrival window quoted to a customer on the phone. Narrow enough
      to be worth having, wide enough to absorb a job running over earlier in the
      route. Two hours is the field-service norm; measure against actual arrival
      spread once there is history.

  hard_window_buffer_minutes:
    value: 15
    source: estimated
    note: >-
      Margin preferred before a hard deadline. Finishing at exactly 09:00 satisfies a
      "done before we open at 09:00" window but leaves nothing for a slow drive. This
      is priced at lateness_per_minute, not enforced: the planner prefers margin and
      never refuses work for want of it, and the invariant checker still accepts a
      plan that uses the full window, so a repair under pressure may spend it.

commitment:
  # What it costs to break a promise, by what the customer told us they arranged.
  # The model identifies which of these a caller expressed; these numbers are not the
  # model's to choose. Asking a language model to price goodwill would produce a
  # confident figure with nothing behind it.
  time_off_work:
    value: 250.0
    source: estimated
    note: >-
      "I'll take the morning off." A wasted day of someone's leave. The phrase that
      motivated this whole field.

  waiting_in:
    value: 90.0
    source: estimated
    note: '"I''ll be in all day." Inconvenient to move, but not a day surrendered.'

  arranged_childcare:
    value: 200.0
    source: estimated
    note: "Cover that has to be rebooked, often at a cost to the customer."

  business_closed:
    value: 400.0
    source: estimated
    note: >-
      A shop closing or opening late for us. Directly costs the customer trade, and
      the account is usually worth more than one job.

  already_rescheduled:
    value: 300.0
    source: estimated
    note: >-
      We have moved this once already. Escalating deliberately: the second call is
      much more expensive than the first in goodwill, even though it costs the same
      in minutes.

  max_total:
    value: 600.0
    source: estimated
    note: >-
      Ceiling on the sum. Without it a caller listing every inconvenience could make
      one job effectively immovable and distort the whole week around it.

autonomy:
  max_auto_cost_delta:
    value: 150.0
    source: estimated
    note: >-
      Largest cost increase the system may absorb without asking. Structural rules
      come first - nothing customer-visible is ever auto-applied regardless of price -
      so this only bounds how expensive a silent internal reshuffle may get.

  max_auto_changes:
    value: 12
    source: estimated
    note: >-
      Largest number of job movements applied without review. A repair that churns
      half the week is worth a human glance even when no promise is broken, because
      crews have already looked at their routes.

penalties:
  unserved_base:
    value: 500.0
    source: estimated
    note: >-
      What leaving a normal-priority job unscheduled costs in goodwill and
      deferred revenue. Scaled by priority, then added to revenue_weight x revenue.

  deferral_escalation:
    value: 250.0
    source: estimated
    note: >-
      Added per prior deferral. Load-bearing: without it, cost minimisation drops
      the same far-out, low-revenue customer every single day until they leave.
      Should be large enough that ~3 deferrals make a job effectively mandatory.

  lateness_per_minute:
    value: 2.0
    source: estimated
    note: "Cost of finishing past a soft window. Hard windows are not priced, they are enforced."

  revenue_weight:
    value: 0.5
    source: estimated
    note: >-
      How much a job's revenue counts toward its unserved penalty. At 1.0 the
      optimiser serves purely by ticket size and neglects small jobs.

travel:
  road_factor:
    value: 1.3
    source: estimated
    note: >-
      Straight-line to road-distance ratio, used only by the synthetic provider.
      Becomes irrelevant once OSRM supplies real network distances.

  approach_minutes:
    value: 2
    source: estimated
    note: "Parking, approach, walking to the door. Per leg."

  traffic_multipliers:
    early:
      value: 0.95
      source: estimated
      note: "Before 07:00."
    am_peak:
      value: 1.45
      source: estimated
      note: "07:00-09:30. Replace with sampled Google corridor data."
    midday:
      value: 1.05
      source: estimated
      note: "09:30-15:00."
    pm_peak:
      value: 1.50
      source: estimated
      note: "15:00-18:30. Replace with sampled Google corridor data."
    evening:
      value: 0.90
      source: estimated
      note: "After 18:30."

service_area:
  radius_miles:
    value: 30.0
    source: estimated
    note: >-
      Beyond this a single job burns 2+ hours of drive time. Treated as a business
      rule rather than something the objective rediscovers every morning.

horizon:
  days:
    value: 5
    source: estimated
    note: >-
      Rolling planning window. Long enough that booking suggestions are useful and
      material lead times are representable; short enough that a day-solve per day
      stays interactive.

  day_capacity_utilization:
    value: 0.65
    source: estimated
    note: >-
      Share of a crew's shift assumed to be on-site rather than driving or waiting,
      used only as a coarse capacity bound when assigning jobs to days. Too high and
      days are over-filled and spill; too low and the horizon looks falsely full.
      Measure from actual routes once there is history.

  sector_spread_penalty:
    value: 45.0
    source: estimated
    note: >-
      Cost of a crew day touching one more compass sector around the depot. This is
      what makes the planner group the north side on one day and the south side on
      another, the way a dispatcher already thinks.

  day_delay_penalty:
    value: 12.0
    source: estimated
    note: >-
      Cost per day of pushing a job later in the horizon, scaled by priority. Keeps
      urgent and long-deferred work near the front without hard-coding an order.

solver:
  max_solve_seconds:
    value: 10.0
    source: estimated
    note: "Ceiling per day-solve. The hot path needs sub-second; this is the batch bound."

  search_workers:
    value: 1
    source: estimated
    note: >-
      Single-threaded keeps results reproducible, which scenario replay and eval
      baselines depend on. Raise only for interactive solves that are not scored.

  random_seed:
    value: 0
    source: estimated
    note: "Fixed so identical input yields an identical plan."
