[project]
name = "glass-guru"
version = "0.1.0"
description = "AI field-service dispatch and scheduling for a glass/window business"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "ortools>=9.11",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "boto3>=1.35",
    "langgraph>=0.2",
    "langchain-aws>=0.2",
    "langsmith>=0.1",
    "mcp>=1.1",
    "redis>=5.1",
    "pygeohash>=1.2",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.scripts]
glass-guru = "glass_guru.cli.main:main"
glass-guru-mcp = "glass_guru.mcp_server.server:main"
glass-guru-api = "glass_guru.api.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glass_guru"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*", "pygeohash.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# Test bodies stay strict about real type errors but are not required to annotate
# every pytest function signature - fixtures supply those types at runtime.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# starlette's test client still uses a deprecated anyio alias; not ours to fix.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
